# render.yaml — Render Blueprint for Hakobu (listmonk fork) / 株式会社ネオビジョンテックス
# 無料構成（行田さん了承 2026/10/27）:
#   - Web: Render 無料枠（15分無通信でスリープ → .github/workflows/keepalive.yml が10分ごとに起こす）
#   - DB : Neon 無料枠の PostgreSQL（Render 無料DBは約30日で消えるため使わない）
#   - 送信: Brevo SMTP 2525番（Render 無料枠は 25/465/587 番の外向き通信を止めている）
# DB の接続情報と管理者パスワードは Render の画面で入れる（sync: false）。このリポジトリには書かない。
#
# Deploy: Render Dashboard → New → Blueprint → neovisiontex/neovision-mail を接続。

services:
  - type: web
    name: neovision-mail
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    autoDeploy: true
    envVars:
      # --- DB: Neon（値は Render の画面で入力）---
      - key: LISTMONK_db__host
        sync: false
      - key: LISTMONK_db__port
        value: "5432"
      - key: LISTMONK_db__user
        sync: false
      - key: LISTMONK_db__password
        sync: false
      - key: LISTMONK_db__database
        sync: false
      - key: LISTMONK_db__ssl_mode
        value: require
      - key: LISTMONK_db__max_open
        value: "10"
      - key: LISTMONK_db__max_idle
        value: "5"
      - key: LISTMONK_db__max_lifetime
        value: "300s"
      - key: TZ
        value: Asia/Tokyo
      # --- First-run super admin (auto-created on --install) ---
      - key: LISTMONK_ADMIN_USER
        value: admin
      # Render generates a strong value; view it in Dashboard → neovision-mail → Environment.
      - key: LISTMONK_ADMIN_PASSWORD
        generateValue: true
