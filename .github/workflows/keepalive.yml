name: keepalive
# Render の無料枠は15分アクセスが無いとスリープする。10分ごとにサイトを叩いて
# コールドスタートを防ぐ。※GitHubのスケジュールは負荷で数分ジッターするため、
# 稀に15分を超えてスリープすることがある。
# ※公開リポジトリのスケジュールは、60日間コミットが無いと GitHub が自動で止める。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Hakobu to prevent Render free-tier spin-down
        run: |
          URL="https://neovision-mail.onrender.com/"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "site is awake"
              exit 0
            fi
            sleep 15
          done
          echo "site did not respond with 200/302 after 3 attempts (may be a cold start)"
